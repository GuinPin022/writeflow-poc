name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Dashboard React (sous-projet) -> publie sous /dashboard sur la meme Pages.
      - name: Build dashboard
        working-directory: dashboard
        run: npm ci && npm run build

      - name: Copy dashboard into Pages output
        run: |
          mkdir -p dist/dashboard
          cp -r dashboard/dist/* dist/dashboard/

      # Genere le manifeste cloud avec la vraie URL GitHub Pages (owner + repo),
      # pour qu'il soit telechargeable a https://OWNER.github.io/REPO/manifest.github.xml
      - name: Generate hosted manifest
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          BASE="https://${OWNER}.github.io/${REPO}"
          echo "Manifeste cloud -> ${BASE}"
          sed -e "s#https://YOUR-USERNAME.github.io/writeflow-poc#${BASE}#g" \
              -e "s#https://YOUR-USERNAME.github.io#https://${OWNER}.github.io#g" \
              manifest.github.xml > dist/manifest.github.xml

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
